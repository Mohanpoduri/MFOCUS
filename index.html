<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MFOCUS — Photography</title>
<meta name="description" content="MFOCUS — Full quality photography portfolio."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Instrument+Sans:wght@300;400;500&family=Bodoni+Moda:ital,opsz,wght@1,6..96,400&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── RESET ─────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --white:#fafaf8;
  --off:#f2f0eb;
  --black:#0e0e0e;
  --ink:#1a1a1a;
  --mid:#888580;
  --light:#d8d5cf;
  --rule:rgba(0,0,0,0.1);
  --accent:#c0392b;
}
html{scroll-behavior:smooth;font-size:16px}
body{
  font-family:'Instrument Sans',sans-serif;
  background:var(--white);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ── HEADER ────────────────────────────────────────── */
header{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:56px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2.5rem;
  background:rgba(250,250,248,0.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--rule);
}
.logo{
  font-family:'Playfair Display',serif;
  font-size:1.35rem;
  font-weight:700;
  letter-spacing:0.08em;
  color:var(--black);
  text-decoration:none;
  display:flex;align-items:center;gap:10px;
}
.logo-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);
  display:inline-block;
  margin-bottom:2px;
}
.header-right{display:flex;align-items:center;gap:1.5rem}
.header-meta{
  font-size:0.68rem;letter-spacing:0.18em;
  text-transform:uppercase;color:var(--mid);
}
.admin-btn{
  font-family:'Instrument Sans',sans-serif;
  font-size:0.65rem;letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--mid);text-decoration:none;
  padding:5px 12px;
  border:1px solid var(--light);
  border-radius:1px;
  transition:all 0.2s;
}
.admin-btn:hover{color:var(--black);border-color:var(--black)}

/* ── HERO ───────────────────────────────────────────── */
.hero{
  padding:100px 2.5rem 56px;
  max-width:1400px;margin:0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0;
  align-items:end;
  border-bottom:1px solid var(--rule);
  margin-bottom:0;
}
@media(max-width:680px){.hero{grid-template-columns:1fr;padding-top:88px}}
.hero-left{}
.hero-kicker{
  font-size:0.62rem;letter-spacing:0.38em;
  text-transform:uppercase;color:var(--mid);
  margin-bottom:1.4rem;
  display:flex;align-items:center;gap:10px;
  opacity:0;animation:fadeUp 0.6s 0.1s ease both;
}
.hero-kicker::before{content:'01';color:var(--light);font-size:0.58rem}
.hero h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(3.2rem,7vw,6.5rem);
  font-weight:400;
  line-height:0.95;
  letter-spacing:-0.01em;
  color:var(--black);
  margin-bottom:1.8rem;
  opacity:0;animation:fadeUp 0.7s 0.2s ease both;
}
.hero h1 em{
  font-style:italic;
  color:var(--mid);
}
.hero-desc{
  font-size:0.9rem;
  color:var(--mid);
  font-weight:300;
  line-height:1.75;
  max-width:340px;
  opacity:0;animation:fadeUp 0.6s 0.35s ease both;
}
.hero-right{
  display:flex;flex-direction:column;
  align-items:flex-end;gap:2rem;
  padding-bottom:0.5rem;
  opacity:0;animation:fadeUp 0.6s 0.45s ease both;
}
@media(max-width:680px){.hero-right{align-items:flex-start;margin-top:2rem}}
.hero-stat{}
.hero-stat-num{
  font-family:'Playfair Display',serif;
  font-size:3.5rem;font-weight:400;
  color:var(--black);line-height:1;
  display:block;
}
.hero-stat-label{
  font-size:0.6rem;letter-spacing:0.22em;
  text-transform:uppercase;color:var(--mid);
  display:block;margin-top:4px;
}

/* ── FILTER BAR ────────────────────────────────────── */
.filter-wrap{
  position:sticky;top:56px;z-index:100;
  background:rgba(250,250,248,0.96);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule);
  opacity:0;animation:fadeUp 0.5s 0.55s ease both;
}
.filter-inner{
  max-width:1400px;margin:0 auto;
  padding:0 2.5rem;
  display:flex;align-items:center;gap:0;
  overflow-x:auto;
  scrollbar-width:none;
}
.filter-inner::-webkit-scrollbar{display:none}
.filter-label{
  font-size:0.6rem;letter-spacing:0.25em;
  text-transform:uppercase;color:var(--light);
  padding:1rem 1.2rem 1rem 0;
  border-right:1px solid var(--rule);
  margin-right:1.2rem;
  white-space:nowrap;
  flex-shrink:0;
}
.chip{
  font-family:'Instrument Sans',sans-serif;
  font-size:0.65rem;letter-spacing:0.1em;
  text-transform:uppercase;
  padding:1rem 1.1rem;
  border:none;background:transparent;
  color:var(--mid);cursor:pointer;
  transition:all 0.18s;
  white-space:nowrap;flex-shrink:0;
  position:relative;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
}
.chip:hover{color:var(--black)}
.chip.on{color:var(--black);border-bottom-color:var(--black);font-weight:500}
.chip .n{
  font-size:0.52rem;
  color:var(--light);
  margin-left:4px;
}
.chip.on .n{color:var(--mid)}

/* ── GALLERY ────────────────────────────────────────── */
.gallery-wrap{max-width:1400px;margin:0 auto;padding:2.5rem}
.masonry{columns:3;column-gap:16px}
@media(max-width:1000px){.masonry{columns:2}}
@media(max-width:560px){.masonry{columns:1}}

.card{
  break-inside:avoid;
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  background:var(--off);
  opacity:0;
  animation:fadeUp 0.5s ease both;
}
.card img{
  width:100%;display:block;
  transition:transform 0.6s cubic-bezier(0.25,0.46,0.45,0.94);
}
.card:hover img{transform:scale(1.04)}

.card-info{
  position:absolute;
  bottom:0;left:0;right:0;
  padding:2rem 1.2rem 1.2rem;
  background:linear-gradient(to top,rgba(10,10,10,0.72) 0%,transparent 100%);
  transform:translateY(100%);
  transition:transform 0.32s cubic-bezier(0.25,0.46,0.45,0.94);
}
.card:hover .card-info{transform:translateY(0)}
.card-cat{
  font-size:0.55rem;letter-spacing:0.22em;
  text-transform:uppercase;color:rgba(255,255,255,0.6);
  margin-bottom:4px;
}
.card-title{
  font-family:'Playfair Display',serif;
  font-style:italic;
  font-size:1.05rem;color:#fff;
}
.card-num{
  position:absolute;top:12px;left:12px;
  font-size:0.52rem;letter-spacing:0.15em;
  color:rgba(255,255,255,0.5);
  background:rgba(0,0,0,0.35);
  padding:3px 7px;border-radius:1px;
  opacity:0;transition:opacity 0.2s;
}
.card:hover .card-num{opacity:1}

/* ── STATE ──────────────────────────────────────────── */
.state-box{
  max-width:1400px;margin:0 auto;
  padding:5rem 2.5rem;text-align:center;
}
.state-box h3{
  font-family:'Playfair Display',serif;
  font-size:1.6rem;font-weight:400;
  color:var(--mid);margin-bottom:0.5rem;
}
.state-box p{font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--light)}
.spin{
  width:24px;height:24px;
  border:1px solid var(--light);
  border-top-color:var(--black);
  border-radius:50%;
  animation:spin 0.75s linear infinite;
  margin:0 auto 1.2rem;
}

/* ── LIGHTBOX ────────────────────────────────────────── */
.lb{
  position:fixed;inset:0;z-index:9999;
  background:rgba(250,250,248,0.97);
  display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(16px);
}
.lb.open{display:flex}
.lb-inner{
  position:relative;
  max-width:88vw;max-height:88vh;
  display:flex;flex-direction:column;align-items:center;
}
.lb-inner img{
  max-width:100%;max-height:82vh;
  object-fit:contain;
  box-shadow:0 8px 60px rgba(0,0,0,0.12);
}
.lb-meta{
  margin-top:1.2rem;
  display:flex;align-items:center;gap:1.5rem;
}
.lb-cat{
  font-size:0.6rem;letter-spacing:0.22em;
  text-transform:uppercase;color:var(--mid);
}
.lb-title{
  font-family:'Playfair Display',serif;
  font-style:italic;font-size:1.05rem;color:var(--black);
}
.lb-close{
  position:fixed;top:1.5rem;right:1.5rem;
  font-family:'Instrument Sans',sans-serif;
  font-size:0.62rem;letter-spacing:0.2em;
  text-transform:uppercase;
  padding:8px 16px;
  border:1px solid var(--light);background:var(--white);
  color:var(--mid);cursor:pointer;
  transition:all 0.2s;border-radius:1px;
}
.lb-close:hover{border-color:var(--black);color:var(--black)}
.lb-nav{
  position:fixed;top:50%;transform:translateY(-50%);
  font-size:1rem;
  padding:1rem 1.2rem;
  border:1px solid var(--rule);
  background:var(--white);
  color:var(--mid);cursor:pointer;
  transition:all 0.2s;border-radius:1px;
}
.lb-nav:hover{border-color:var(--black);color:var(--black)}
.lb-prev{left:1.2rem}.lb-next{right:1.2rem}
.lb-counter{
  position:fixed;bottom:1.8rem;left:50%;transform:translateX(-50%);
  font-size:0.6rem;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--mid);
}

/* ── FOOTER ──────────────────────────────────────────── */
footer{
  border-top:1px solid var(--rule);
  padding:1.5rem 2.5rem;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:1rem;
  max-width:1400px;margin:0 auto;
  font-size:0.6rem;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--light);
}
.f-live{display:flex;align-items:center;gap:7px}
.f-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--accent);
  animation:blink 2.5s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">
    <span class="logo-dot"></span>MFOCUS
  </a>
  <div class="header-right">
    <span class="header-meta" id="hMeta">Photography</span>
    <a class="admin-btn" href="admin.html">Admin</a>
  </div>
</header>

<section class="hero">
  <div class="hero-left">
    <div class="hero-kicker">Full Quality Photography</div>
    <h1>Every<br/><em>frame</em><br/>matters.</h1>
    <p class="hero-desc">A curated collection of photographs spanning every genre — captured and presented at full quality.</p>
  </div>
  <div class="hero-right">
    <div class="hero-stat">
      <span class="hero-stat-num" id="totalCnt">—</span>
      <span class="hero-stat-label">Photographs</span>
    </div>
    <div class="hero-stat">
      <span class="hero-stat-num" id="catCnt">—</span>
      <span class="hero-stat-label">Categories</span>
    </div>
  </div>
</section>

<div class="filter-wrap">
  <div class="filter-inner">
    <span class="filter-label">Browse</span>
    <div id="chips"></div>
  </div>
</div>

<div id="stateBox" class="state-box">
  <div class="spin"></div>
  <h3>Loading</h3>
  <p>Fetching photographs…</p>
</div>

<section class="gallery-wrap" id="galleryWrap" style="display:none">
  <div class="masonry" id="grid"></div>
</section>

<div class="lb" id="lb">
  <button class="lb-close" onclick="closeLb()">✕ Close</button>
  <button class="lb-nav lb-prev" onclick="navLb(-1)">←</button>
  <button class="lb-nav lb-next" onclick="navLb(1)">→</button>
  <div class="lb-inner">
    <img id="lbImg" src="" alt=""/>
    <div class="lb-meta">
      <span class="lb-cat" id="lbCat"></span>
      <span class="lb-title" id="lbTitle"></span>
    </div>
  </div>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<footer>
  <div class="f-live"><span class="f-dot"></span>MFOCUS — Live Portfolio</div>
  <div id="fYear"></div>
  <div>Full Quality · Supabase Storage</div>
</footer>

<script>
/* ── CONFIG — replace after Supabase setup ────────── */
const SURL = 'YOUR_SUPABASE_URL';
const SKEY = 'YOUR_SUPABASE_ANON_KEY';
/* ─────────────────────────────────────────────────── */

const sb = supabase.createClient(SURL, SKEY);
document.getElementById('fYear').textContent = '© ' + new Date().getFullYear() + ' MFOCUS';

let all = [], filtered = [], lbIdx = 0, activeFilter = 'all';

async function load() {
  try {
    const { data, error } = await sb
      .from('photos').select('*')
      .order('created_at', { ascending: false });
    if (error) throw error;
    all = data || [];
  } catch(e) {
    document.getElementById('stateBox').innerHTML =
      '<h3>Not Configured</h3><p>Add Supabase credentials to the HTML</p>';
    return;
  }

  document.getElementById('stateBox').style.display = 'none';
  document.getElementById('galleryWrap').style.display = 'block';
  document.getElementById('totalCnt').textContent = all.length;
  document.getElementById('catCnt').textContent = new Set(all.map(p => p.category)).size;
  document.getElementById('hMeta').textContent =
    new Set(all.map(p => p.category)).size + ' Categories';

  buildChips();
  applyFilter('all');
}

function buildChips() {
  const cats = [...new Set(all.map(p => p.category))];
  const wrap = document.getElementById('chips');
  wrap.innerHTML =
    `<button class="chip on" onclick="applyFilter('all',this)">All <span class="n">${all.length}</span></button>`;
  cats.forEach(cat => {
    const n = all.filter(p => p.category === cat).length;
    const b = document.createElement('button');
    b.className = 'chip';
    b.innerHTML = `${esc(cat)} <span class="n">${n}</span>`;
    b.onclick = function() { applyFilter(cat, this); };
    wrap.appendChild(b);
  });
}

function applyFilter(cat, el) {
  activeFilter = cat;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  (el || document.querySelector('.chip')).classList.add('on');
  filtered = cat === 'all' ? [...all] : all.filter(p => p.category === cat);
  renderGrid();
}

function renderGrid() {
  const g = document.getElementById('grid');
  g.innerHTML = '';
  if (!filtered.length) {
    document.getElementById('stateBox').style.display = 'block';
    document.getElementById('stateBox').innerHTML =
      '<h3>No photos</h3><p>Nothing in this category yet</p>';
    document.getElementById('galleryWrap').style.display = 'none';
    return;
  }
  document.getElementById('stateBox').style.display = 'none';
  document.getElementById('galleryWrap').style.display = 'block';

  filtered.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (i * 0.04) + 's';
    card.innerHTML = `
      <span class="card-num">${String(i+1).padStart(2,'0')}</span>
      <img src="${p.url}" alt="${esc(p.title)}" loading="lazy"/>
      <div class="card-info">
        <div class="card-cat">${esc(p.category)}</div>
        <div class="card-title">${esc(p.title)}</div>
      </div>`;
    card.onclick = () => openLb(i);
    g.appendChild(card);
  });
}

function openLb(i) {
  lbIdx = i; showLb(filtered[i]);
  document.getElementById('lb').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function showLb(p) {
  document.getElementById('lbImg').src = p.url;
  document.getElementById('lbCat').textContent = esc(p.category);
  document.getElementById('lbTitle').textContent = esc(p.title);
  document.getElementById('lbCounter').textContent =
    (lbIdx + 1) + ' / ' + filtered.length;
}
function navLb(d) {
  lbIdx = (lbIdx + d + filtered.length) % filtered.length;
  showLb(filtered[lbIdx]);
}
function closeLb() {
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => {
  if (!document.getElementById('lb').classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') navLb(-1);
  if (e.key === 'ArrowRight') navLb(1);
});

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

load();
</script>
</body>
</html>
